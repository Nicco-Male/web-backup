name: Temporary DNS probe

on:
  push:
    branches:
      - codex-dns-probe-20260714
    paths:
      - .github/workflows/codex-dns-probe.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          {
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            echo 'smpisa.ddns.net:'
            getent ahostsv4 smpisa.ddns.net | awk '{print $1}' | sort -u
            echo 'git.niccomale.it:'
            getent ahostsv4 git.niccomale.it | awk '{print $1}' | sort -u
          } > tmp/codex-dns-result.txt
          cat tmp/codex-dns-result.txt
      - name: Save result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'codex-dns-probe'
          git config user.email 'codex-dns-probe@users.noreply.github.com'
          git add tmp/codex-dns-result.txt
          git commit -m 'chore: save DNS probe result [dns-result]'
          git push
